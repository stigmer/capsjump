# Releases CapsJump when a v<x.y.z> tag is pushed: tests, a universal build signed with
# the Developer ID, notarization and stapling, a GitHub release carrying the zip, and the
# cask in github.com/stigmer/homebrew-tap updated to it.
#
# Eight repository secrets drive it, all required: the seven Apple ones the desktop app's
# release uses (APPLE_CERTIFICATE as a base64 .p12, APPLE_CERTIFICATE_PASSWORD,
# APPLE_SIGNING_IDENTITY, APPLE_TEAM_ID, APPLE_API_ISSUER, APPLE_API_KEY, APPLE_API_KEY_P8
# as a base64 .p8) and HOMEBREW_TAP_DEPLOY_KEY, the private half of a deploy key with write
# access to stigmer/homebrew-tap alone. The
# scripts under scripts/ do the work and run the same on a laptop; these steps only move
# secrets into files and environment variables. A release is never signed partly: with
# any secret missing, the run stops before building.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check the tag names VERSION
        id: version
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION ($version); bump VERSION in the tagged commit"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Require every secret
        # Secrets are not visible to a step-level `if:`, so presence is checked here.
        env:
          HAS_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
          HAS_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
          HAS_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
          HAS_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
          HAS_API_ISSUER: ${{ secrets.APPLE_API_ISSUER != '' }}
          HAS_API_KEY: ${{ secrets.APPLE_API_KEY != '' }}
          HAS_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 != '' }}
          HAS_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY != '' }}
        run: |
          set -euo pipefail
          missing=()
          for name in CERTIFICATE CERTIFICATE_PASSWORD SIGNING_IDENTITY TEAM_ID API_ISSUER API_KEY API_KEY_P8 TAP_DEPLOY_KEY; do
            flag="HAS_$name"
            [ "${!flag}" = "true" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::release secrets missing: ${missing[*]} (APPLE_* and HOMEBREW_TAP_DEPLOY_KEY); nothing was built"
            exit 1
          fi

      - name: Test
        run: swift test

      - name: Import the signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          P12="$RUNNER_TEMP/certificate.p12"
          echo -n "$APPLE_CERTIFICATE" | base64 --decode > "$P12"
          chmod 600 "$P12"
          scripts/macos-import-signing-keychain.sh "$P12" "$RUNNER_TEMP/capsjump-signing.keychain-db"
          rm -f "$P12"

      - name: Install the notarization key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          echo -n "$APPLE_API_KEY_P8" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build and sign
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: scripts/bundle.sh --identity "$APPLE_SIGNING_IDENTITY" --out "$RUNNER_TEMP/bundle"

      - name: Notarize, staple and zip
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          scripts/notarize.sh "$RUNNER_TEMP/bundle/CapsJump.app" "dist/CapsJump-$VERSION.zip"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" "dist/CapsJump-$VERSION.zip" \
            --repo "$GITHUB_REPOSITORY" --title "CapsJump $VERSION" --generate-notes

      - name: Checkout homebrew-tap
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: stigmer/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          # This job pushes the cask to the tap with git, so the checkout keeps its key.
          path: homebrew-tap

      - name: Update the cask
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          sha="$(shasum -a 256 "dist/CapsJump-$VERSION.zip" | cut -d' ' -f1)"
          mkdir -p homebrew-tap/Casks
          sed -e "s/@VERSION@/$VERSION/" -e "s/@SHA256@/$sha/" packaging/capsjump.rb.in > homebrew-tap/Casks/capsjump.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/capsjump.rb
          git commit -m "Update capsjump to $VERSION"
          git push
